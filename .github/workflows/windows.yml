#
# Builds the GPU effects module (gpufx, see README.md) and its settings page
# for Kdenlive's Windows standalone build, tests them inside that build, and
# packages them laid out like the standalone's folder: merging the package's
# kdenlive-<version>_standalone folder into an installed one adds them.
#
# The workflow uses no action but actions/upload-artifact: the source is
# fetched with git, and the compiler comes from the MSYS2 installation of
# GitHub's Windows runners.

name: Windows

on:
  workflow_dispatch:
    inputs:
      kdenlive_version:
        description: Kdenlive release whose Windows standalone build the module is tested with and laid out for
        required: true
        default: '26.08.1'
  push:
  pull_request:

permissions:
  contents: read

env:
  KDENLIVE_VERSION: ${{ inputs.kdenlive_version || '26.08.1' }}
  # MLT headers to compile with. The module adapts to the version of the MLT
  # it is loaded into at runtime.
  MLT_HEADERS: v7.42.0

jobs:
  windows:
    name: Build and test with Kdenlive ${{ inputs.kdenlive_version || '26.08.1' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # For the steps in MSYS2's shell: its UCRT64 environment, in the
      # workspace. Kdenlive's Windows builds use MinGW with the UCRT C
      # runtime: so does this toolchain, the module and MLT share memory.
      MSYSTEM: UCRT64
      CHERE_INVOKING: '1'
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
    steps:
      - name: Get the source and MLT's headers
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q source
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -C source -c http.extraheader="$auth" fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git -C source checkout -q FETCH_HEAD
          git clone -q --depth 1 --branch "$MLT_HEADERS" https://github.com/mltframework/mlt.git mlt

      - name: Get Kdenlive's standalone build
        shell: pwsh
        run: |
          $version = $env:KDENLIVE_VERSION
          $series = $version -replace '\.[^.]+$', ''
          $name = "kdenlive-${version}_standalone.exe"
          # Older releases move to the Attic
          foreach ($base in "https://download.kde.org/stable/kdenlive/$series/windows", "https://download.kde.org/Attic/kdenlive/$series/windows") {
            Write-Output "Downloading $base/$name"
            curl.exe --fail --location --retry 3 --connect-timeout 30 --silent --show-error --output $name "$base/$name"
            if ($LASTEXITCODE -eq 0) { break }
            Remove-Item $name -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path $name)) { throw "Cannot download $name from download.kde.org" }
          7z x $name -okdenlive -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cannot extract $name" }
          $mlt = Get-ChildItem kdenlive -Recurse -Filter libmlt-7.dll | Select-Object -First 1
          if (-not $mlt) { throw "$name has no libmlt-7.dll" }
          $root = Split-Path (Split-Path $mlt.FullName)
          "KDENLIVE_ROOT=$root" >> $env:GITHUB_ENV
          Write-Output "Kdenlive's folder: $root"

      # Qt and KDE Frameworks for the settings page, which uses Kdenlive's own
      # at runtime
      - name: Install the compiler and libraries
        run: |
          pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja \
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-kconfigwidgets
          pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-kconfig mingw-w64-ucrt-x86_64-kconfigwidgets

      - name: Build
        run: |
          root=$(cygpath -m "$KDENLIVE_ROOT")
          # Linked to Kdenlive's own libmlt-7.dll, so that a function it does
          # not have fails the build
          cmake -S source -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMLT_INCLUDE_DIR="$(cygpath -m "$PWD/mlt/src")" -DMLT_LIBRARY="$root/bin/libmlt-7.dll"
          cmake --build build
          test -f build/gpufx/gpufx-settings.dll || { echo "::error::The settings page was not built"; exit 1; }

      - name: Check the module's dependencies
        run: |
          deps=$(objdump -p build/libmltgpufx.dll | awk '/DLL Name:/ {print $3}')
          echo "$deps"
          for dll in $deps; do
            case "${dll,,}" in
              kernel32.dll|api-ms-win-crt-*.dll|libmlt-7.dll) ;;
              *) echo "::error::libmltgpufx.dll needs $dll, which is not part of Windows or MLT"; exit 1 ;;
            esac
          done

      # The libraries of Kdenlive's build whose behaviour the module copies or
      # whose functions it uses, with their versions and SHA-256, to compare
      # Kdenlive versions
      - name: List the libraries the module depends on
        shell: pwsh
        run: |
          $root = $env:KDENLIVE_ROOT
          $mlt = & "$root\bin\melt.exe" -version 2>&1 | Select-Object -First 1
          "MLT: $mlt"
          $files = @(Get-ChildItem "$root\bin" -File | Where-Object { $_.Name -match '^(libmlt(\+\+)?-7|Qt6(Core|Gui|Widgets)|(avcodec|avformat|avutil|swscale)-\d+|libKF6Config(Core|Widgets))\.dll$' })
          $files += Get-ChildItem "$root\lib\mlt" -File -Filter *.dll
          $files += Get-ChildItem "$root\lib\frei0r-1" -File -ErrorAction SilentlyContinue | Where-Object { $_.BaseName -in 'squareblur', 'glow', 'softglow', 'sharpness' }
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.Substring(0, 16)
            '{0,-45} {1,-22} {2,10} {3}' -f $file.FullName.Substring($root.Length + 1), $file.VersionInfo.FileVersion, $file.Length, $hash
          }

      # The page is built with MSYS2's Qt and KDE Frameworks but runs with
      # Kdenlive's, which can be older: every function it imports must be in
      # Kdenlive's libraries.
      - name: Check the settings page against Kdenlive's libraries
        run: |
          bin="$(cygpath -u "$KDENLIVE_ROOT")/bin"
          echo "Qt: Kdenlive $(powershell -NoProfile -Command "(Get-Item '$(cygpath -w "$bin/Qt6Core.dll")').VersionInfo.ProductVersion"), built with $(powershell -NoProfile -Command "(Get-Item '$(cygpath -w /ucrt64/bin/Qt6Core.dll)').VersionInfo.ProductVersion")"
          check_imports() {
            local file=$1 status=0
            for dll in $(objdump -p "$file" | awk '/DLL Name:/ {print $3}'); do
              case "${dll,,}" in
                kernel32.dll|user32.dll|api-ms-win-crt-*.dll|libmlt-7.dll) continue ;;
              esac
              if [ ! -f "$bin/$dll" ]; then
                echo "::error::$(basename "$file") needs $dll, which is not in Kdenlive's bin folder"
                status=1
                continue
              fi
              # Imported names of this DLL (the lines after its "DLL Name"
              # that start with an address and end with the name; versions of
              # objdump differ in the columns between), and the names
              # Kdenlive's copy exports
              objdump -p "$file" | tr -d '\r' | awk -v dll="$dll" '
                /DLL Name:/ {inside = ($3 == dll); next}
                /^[ \t]*$/ {inside = 0}
                inside && NF >= 3 && $1 ~ /^[0-9a-fA-F]+$/ {print $NF}' | sort -u > imports.txt
              objdump -p "$bin/$dll" | tr -d '\r' | awk '/^[ \t]*\[ *[0-9]+\]/ {print $NF}' | sort -u > exports.txt
              missing=$(comm -23 imports.txt exports.txt)
              echo "$(basename "$file") -> $dll: $(wc -l < imports.txt) functions"
              if [ ! -s exports.txt ]; then
                echo "::error::No function found in the exports of Kdenlive's $dll"
                objdump -p "$bin/$dll" | grep -A 4 "Ordinal/Name Pointer" | cat -A
                status=1
              fi
              if [ ! -s imports.txt ]; then
                echo "::error::No function found in the imports of $(basename "$file") from $dll"
                objdump -p "$file" | grep -A 4 "DLL Name: $dll" | cat -A
                status=1
              fi
              if [ -n "$missing" ]; then
                echo "::error::Kdenlive's $dll lacks functions that $(basename "$file") uses"
                echo "$missing" | c++filt
                status=1
              fi
            done
            return $status
          }
          check_imports build/gpufx/gpufx-settings.dll
          check_imports build/tests/gpufx_settings_test.exe

      - name: Test inside Kdenlive's standalone build
        shell: bash
        run: |
          root=$(cygpath -u "$KDENLIVE_ROOT")
          # Installed as in Kdenlive's folder: MLT loads the module from
          # lib/mlt, the module loads the page from lib/mlt/gpufx
          cp build/libmltgpufx.dll "$root/lib/mlt/"
          mkdir -p "$root/lib/mlt/gpufx"
          cp build/gpufx/gpufx-settings.dll "$root/lib/mlt/gpufx/"
          # From bin, MLT finds its modules, data and frei0r plugins as it
          # does for Kdenlive, and Qt finds Kdenlive's libraries and data
          cp build/tests/gpufx_test.exe build/tests/gpufx_settings_test.exe "$root/bin/"
          export QT_QPA_PLATFORM=offscreen
          # The tests' emulated GPU, which runs the kernels on the CPU
          export GPUFX_CUDA_LIBRARY="$(cygpath -w "$PWD/build/tests/libgpufx_mockcuda.dll")"
          "$root/bin/gpufx_test.exe" 2>&1 | tee test.log
          if grep '^SKIP' test.log; then
            echo "::error::Kdenlive's MLT lacks services that the tests need"
            exit 1
          fi
          MOCKCUDA_NO_DEVICE=1 "$root/bin/gpufx_test.exe" --no-gpu 2>&1 | tail -n 3
          "$root/bin/gpufx_test.exe" --settings-off 2>&1 | tail -n 3
          # The settings page with Kdenlive's Qt and KDE Frameworks, offscreen
          # if Kdenlive has Qt's plugin for it
          find "$root" -ipath '*platforms*' -iname 'q*.dll'
          platform=windows
          if find "$root" -iname qoffscreen.dll | grep -q .; then
            platform=offscreen
          fi
          mkdir -p screenshot
          QT_QPA_PLATFORM=$platform "$root/bin/gpufx_settings_test.exe" "$(cygpath -w "$PWD/screenshot/settings-page.png")" 2>&1 | tee settings-test.log

      - name: Package
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          folder="kdenlive-${KDENLIVE_VERSION}_standalone"
          cmake --install build --prefix "dist/$folder"
          cat > dist/README-gpufx.txt <<EOF
          GPU effects (gpufx) for Kdenlive ${KDENLIVE_VERSION} on Windows

          Built from ${GITHUB_REPOSITORY} commit ${GITHUB_SHA}
          by ${RUN_URL}

          To install, drag the $folder folder into the folder that contains your
          Kdenlive folder and let Windows merge them. It adds two files:
          $folder\\lib\\mlt\\libmltgpufx.dll, the GPU effects, which Kdenlive and its
          renderer load on their own, and
          $folder\\lib\\mlt\\gpufx\\gpufx-settings.dll, which adds a GPU Acceleration
          page to Kdenlive's settings (Settings > Configure Kdenlive).
          To uninstall, delete libmltgpufx.dll and the gpufx folder.

          It needs an NVIDIA GPU of the Maxwell generation or newer (GeForce GTX 750
          and later) and its driver. Without them, every effect runs on the CPU as
          before. GPU processing can be turned off on the settings page, or with the
          environment variable MLT_GPUFX=0.

          See ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} for the effects it accelerates.
          EOF
          find dist -type f

      # Downloaded as a zip of the dist folder: the README and the
      # kdenlive-<version>_standalone folder
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: gpufx-kdenlive-${{ env.KDENLIVE_VERSION }}-windows
          path: dist/
          if-no-files-found: error

      # The page in Kdenlive itself: a variant of the page opens Kdenlive's
      # settings dialog once its main window is up, shows the page, and saves
      # a screenshot and a report (see GPUFX_SETTINGS_SELFTEST)
      - name: Open the page in Kdenlive
        id: kdenlive
        continue-on-error: true
        shell: pwsh
        run: |
          $root = $env:KDENLIVE_ROOT
          $bin = ($root -replace '\\', '/') + '/bin'
          # Settings of a Kdenlive that ran before: no first run wizard and no
          # welcome screen
          $config = @"
          [version]
          version=$env:KDENLIVE_VERSION

          [sdl]
          sdlAudioBackend=wasapi

          [env]
          kdenliverendererpath=$bin/kdenlive_render.exe

          [startup]
          showWelcome=false
          "@
          Copy-Item build\gpufx\gpufx-settings-selftest.dll "$root\lib\mlt\gpufx\gpufx-settings.dll" -Force
          # Without Python, which Kdenlive's speech to text and object
          # detection settings would set up first
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Python|WindowsApps' }) -join ';'
          $env:GPUFX_CUDA_LIBRARY = "$PWD\build\tests\libgpufx_mockcuda.dll"
          # Runs Kdenlive with the check, which saves its report and
          # screenshot in screenshot\<name>
          function Test-Kdenlive([string]$name, [string]$page) {
            Set-Content "$env:LOCALAPPDATA\kdenliverc" $config
            $env:GPUFX_SELFTEST_OUTPUT = "$PWD\screenshot\$name"
            $env:GPUFX_SELFTEST_PAGE = $page
            $null = New-Item -ItemType Directory -Force $env:GPUFX_SELFTEST_OUTPUT
            $kdenlive = Start-Process "$root\bin\kdenlive.exe" -PassThru
            # Keeps the handle, without which PowerShell loses the exit code
            $null = $kdenlive.Handle
            $finished = $kdenlive.WaitForExit(240000)
            if (-not $finished) {
              Stop-Process -Id $kdenlive.Id -Force
              $null = $kdenlive.WaitForExit(30000)
            }
            Write-Host "=== $name"
            Get-Content "$env:GPUFX_SELFTEST_OUTPUT\kdenlive-report.txt" -ErrorAction SilentlyContinue | Out-Host
            if (-not $finished) { return "did not finish" }
            return "exit code $($kdenlive.ExitCode)"
          }
          # The dialog with the page, then without it, which tells whether a
          # failure comes from the page or from Kdenlive on the runner
          $with = Test-Kdenlive "with-page" "1"
          $without = Test-Kdenlive "without-page" "0"
          # Crash reports of Kdenlive's crash handler, if any
          Get-ChildItem "$root\bin", $env:TEMP, $env:LOCALAPPDATA -Filter *.RPT -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "--- $($_.FullName)"; Get-Content $_.FullName -TotalCount 80 }
          Copy-Item build\gpufx\gpufx-settings.dll "$root\lib\mlt\gpufx\gpufx-settings.dll" -Force
          Write-Output "with the page: $with"
          Write-Output "without the page: $without"
          if ($with -ne "exit code 0") { throw "The check in Kdenlive failed: $with" }

      - name: Upload screenshots of the settings page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-page-screenshots
          path: screenshot/

      - name: Summary
        shell: bash
        env:
          KDENLIVE_CHECK: ${{ steps.kdenlive.outcome }}
        run: |
          {
            echo "### GPU effects module for Kdenlive ${KDENLIVE_VERSION} on Windows"
            echo
            echo "Download **gpufx-kdenlive-${KDENLIVE_VERSION}-windows** under Artifacts below and unzip it."
            echo "Drag its \`kdenlive-${KDENLIVE_VERSION}_standalone\` folder into the folder that contains your Kdenlive folder and let Windows merge them:"
            echo "it adds \`lib\\mlt\\libmltgpufx.dll\` and \`lib\\mlt\\gpufx\\gpufx-settings.dll\`."
            echo
            echo "Tests run inside Kdenlive ${KDENLIVE_VERSION}'s own build, with an emulated GPU:"
            echo
            echo '```'
            tail -n 1 test.log
            tail -n 1 settings-test.log
            echo '```'
            echo
            if [ "$KDENLIVE_CHECK" = success ]; then
              echo "The settings page also opened in Kdenlive's own settings dialog on the runner."
            else
              echo "The check that opens the settings page in Kdenlive's own settings dialog failed: see the log of its step."
            fi
            echo "**settings-page-screenshots** shows the page in a test dialog and in Kdenlive's settings dialog."
          } >> "$GITHUB_STEP_SUMMARY"
