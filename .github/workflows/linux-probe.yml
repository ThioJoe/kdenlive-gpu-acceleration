# Temporary: lists what Kdenlive's Linux AppImage contains
name: Linux probe

on:
  push:
    paths:
      - .github/workflows/linux-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get the AppImage
        run: |
          base=https://download.kde.org/stable/kdenlive/26.08/linux
          curl -fsSL "$base/" | grep -oE 'href="[^"]+"' | sort -u
          name=$(curl -fsSL "$base/" | grep -oE 'kdenlive-26\.08\.2[^"<>]*\.AppImage' | head -1)
          echo "name: $name"
          curl -fL --retry 3 --silent --show-error -o kdenlive.AppImage "$base/$name"
          chmod +x kdenlive.AppImage
          ./kdenlive.AppImage --appimage-extract > /dev/null
          ls -la squashfs-root

      - name: Layout
        run: |
          r=squashfs-root
          file $r/AppRun $r/AppRun.wrapped 2>/dev/null || true
          if file -L $r/AppRun | grep -q text; then cat $r/AppRun; fi
          find $r -maxdepth 2 | sort | head -100
          for f in $(find $r -maxdepth 3 \( -name '*.sh' -o -name '*.env' \) -type f) $(find $r -path '*apprun-hooks*' -type f); do echo "== $f"; cat "$f"; done
          echo "== libmlt"; find $r -name 'libmlt*'
          echo "== mlt dirs"; find $r -type d -iname '*mlt*'
          echo "== frei0r"; find $r -type d -iname '*frei0r*'
          echo "== platforms"; find $r -path '*platforms*' -name '*.so'
          echo "== selected libs"; find $r \( -name 'libQt6Core.so*' -o -name 'libQt6Widgets.so*' -o -name 'libKF6Config*' -o -name 'libKF6WidgetsAddons*' -o -name 'libstdc++*' -o -name 'libgcc_s*' -o -name 'libavcodec*' -o -name 'libswscale*' -o -name 'libc.so*' -o -name 'ld-linux*' -o -name 'libcuda*' \) | sort
          echo "== usr/lib"; ls $r/usr/lib | head -500
          echo "== include"; find $r -name '*.h' | head

      - name: Requirements
        run: |
          r=squashfs-root
          for f in $r/usr/bin/kdenlive $r/usr/bin/kdenlive_render $r/usr/bin/melt* $(find $r -name 'libmlt-7.so*' -type f) $(find $r -name 'libQt6Core.so*' -type f) $(find $r -name 'libKF6ConfigCore.so*' -type f); do
            [ -f "$f" ] || continue
            echo "$f: $(objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1) $(objdump -T "$f" 2>/dev/null | grep -oE 'GLIBCXX_[0-9.]+' | sort -Vu | tail -1) $(objdump -T "$f" 2>/dev/null | grep -oE 'CXXABI_[0-9.]+' | sort -Vu | tail -1)"
          done
          echo "== max over every ELF file"
          find $r -type f \( -name '*.so*' -o -perm -u+x \) -print0 | xargs -0 file | grep ELF | cut -d: -f1 > elf.txt
          wc -l < elf.txt
          xargs -a elf.txt objdump -T 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -3
          xargs -a elf.txt objdump -T 2>/dev/null | grep -oE 'GLIBCXX_[0-9.]+' | sort -Vu | tail -3
          echo "== which need the newest GLIBC"
          newest=$(xargs -a elf.txt objdump -T 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          for f in $(cat elf.txt); do objdump -T "$f" 2>/dev/null | grep -q "$newest " && echo "$f"; done | head -20
          echo "== comment"; readelf -p .comment $r/usr/bin/kdenlive | head
          readelf -p .comment $(find $r -name 'libmlt-7.so*' -type f | head -1) | head
          echo "== dynamic"; readelf -d $r/usr/bin/kdenlive | grep -E 'RUNPATH|RPATH|NEEDED'
          readelf -d $(find $r -name 'libmlt-7.so*' -type f | head -1) | grep -E 'RUNPATH|RPATH|NEEDED|SONAME'
          echo "== MLT strings"; strings $(find $r -name 'libmlt-7.so*' -type f | head -1) | grep -E 'proc/self/exe|MLT_REPOSITORY|MLT_APPDIR|^/.*(lib|share)' | head
          echo "== Qt"; strings $(find $r -name 'libQt6Core.so.6*' -type f | head -1) | grep -m3 -E 'Qt 6\.[0-9]+|QT_VERSION|6\.[0-9]+\.[0-9]+$'
          ls $(dirname $(find $r -name 'libQt6Core.so.6*' -type f | head -1)) | grep -E 'libQt6Core|libKF6Config|libKF6WidgetsAddons'

      - name: Run melt
        run: |
          r=$PWD/squashfs-root
          export LD_LIBRARY_PATH=$r/usr/lib
          $r/usr/bin/melt -version 2>&1 | head -3 || true
          $r/usr/bin/melt -query filters 2>&1 | grep -E 'dropshadow|box_blur|qtblend|frei0r\.(glow|squareblur)|lift_gamma' || true
          MLT_REPOSITORY=/nonexistent $r/usr/bin/melt -query filters 2>&1 | head -5 || true
          $r/usr/bin/kdenlive --version 2>&1 | head -3 || true
